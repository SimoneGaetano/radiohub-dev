# RadioHub — E2E (X8): i test Playwright del percorso principale
# (cerca → ascolta → preferiti) contro la **stack reale** avviata con Docker.
#
# È un workflow separato da `ci.yml` di proposito: l'E2E avvia quattro container,
# scarica un browser e verifica percorsi lunghi, quindi è più lento e più esposto
# di typecheck/test/build. Tenerlo separato significa che un rosso qui non fa
# apparire "rotto" il progetto quando il CI principale è verde — e resta comunque
# visibile nella scheda Actions.
#
# Non gira sulle push: gira sulle pull request e a mano, così il branch `main`
# conserva un solo check di riferimento.

name: E2E

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Un solo run per ref: un nuovo push sulla PR annulla quello in corso.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `--wait` aspetta gli healthcheck: se un servizio non diventa sano, il
      # passo fallisce qui — invece di far fallire i test con un errore di rete
      # che sembra un difetto dell'applicazione.
      - name: Avvia la stack e attendi gli healthcheck
        run: docker compose up -d --build --wait

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa le dipendenze
        working-directory: frontend
        run: npm ci

      # `--with-deps` installa anche le librerie di sistema richieste da Chromium.
      - name: Installa Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test end-to-end
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run test:e2e

      # Traccia e screenshot: senza, un fallimento in CI è solo una riga rossa e
      # non si sa a che punto del percorso si è fermato.
      - name: Salva report e tracce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Ferma la stack
        if: always()
        run: docker compose down -v
